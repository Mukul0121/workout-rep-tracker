<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Rep Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Workout Rep Tracker</h1>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="nerd-toggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label" id="nerd-label">Stats for Nerds</span>
            </div>
            <select id="exercise-filter">
                <option value="">All</option>
                <option value="squat">Squat</option>
                <option value="curl">Curl</option>
                <option value="pushup">Push-up</option>
                <option value="bench">Bench Press</option>
                <option value="deadlift">Deadlift</option>
            </select>
        </div>
    </header>
    
    <div id="empty-state" class="hidden">
        No sessions yet. Run the tracker to record one.
    </div>

    <main id="dashboard-content">
        <div class="stats-grid">
            <div class="card"><h3>Sessions</h3><p id="stat-sessions">0</p></div>
            <div class="card"><h3>Total reps</h3><p id="stat-total">0</p></div>
            <div class="card"><h3>Best squat</h3><p id="stat-best-squat">0</p></div>
            <div class="card"><h3>Best curl</h3><p id="stat-best-curl">0</p></div>
        </div>

        <div class="chart-container card">
            <h3>Reps per day</h3>
            <canvas id="repsChart"></canvas>
        </div>

        <div class="table-container card">
            <h3>Session history</h3>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Exercise</th>
                            <th>Reps</th>
                            <th>Duration</th>
                            <th class="nerd-col hidden">TUT</th>
                            <th class="nerd-col hidden">Tempo</th>
                        </tr>
                    </thead>                    
                    <tbody id="table-body">
                        <dialog id="tempo-modal" class="card" style="background: var(--bg-grad); border: 1px solid var(--accent); color: white; border-radius: 16px; padding: 30px; max-width: 400px; margin: auto;">
                            <h3 style="margin-top: 0; color: var(--accent);">Per-Rep Breakdown</h3>
                            <div id="tempo-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px; font-family: monospace;"></div>
                            <button onclick="document.getElementById('tempo-modal').close()" style="background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">Close</button>
                        </dialog>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
